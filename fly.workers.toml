# Lotus workers (prize sender, inventory sync, crate expiry) as one always-on Fly Machine.
# Deploy from the repo root: fly deploy -c fly.workers.toml --ha=false
# Keep exactly one Machine (the prize sender must not run twice).
app = 'lotus-workers'
primary_region = 'iad'
# On deploy/stop, SIGTERM lets the current prize-send tick finish before the machine is killed.
kill_signal = 'SIGTERM'
kill_timeout = '60s'

[build]
  dockerfile = 'deploy/workers.Dockerfile'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# Restart on any exit (crash, OOM, 'workers crashed'). Uptime is watched from the web side:
# /api/health turns red when the worker hasn't written a vault snapshot for 15 minutes.
[[restart]]
  policy = 'always'
